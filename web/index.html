<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Supremo Labs — an independent label for apps. WorkIt, TravelSync, PlanSync, WealthSync, NoteSync, and more.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Supremo Labs">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico?v=3" sizes="any"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=3"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=3"/>

  <title>Supremo Labs</title>
  <link rel="manifest" href="manifest.json">

  <!-- Social preview (Open Graph + Twitter/X) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Supremo Labs">
  <meta property="og:title" content="Supremo Labs — an independent label for apps.">
  <meta property="og:description" content="WorkIt, TravelSync, PlanSync, WealthSync, NoteSync, and more — every release designed, built, and shipped end to end by one person.">
  <meta property="og:image" content="https://supremolabs.com/social_preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://supremolabs.com">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Supremo Labs — an independent label for apps.">
  <meta name="twitter:description" content="WorkIt, TravelSync, PlanSync, WealthSync, NoteSync, and more — every release designed, built, and shipped end to end by one person.">
  <meta name="twitter:image" content="https://supremolabs.com/social_preview.png">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
