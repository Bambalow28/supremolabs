name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec path-depends on ../juwa_wealth (the FamFi console). Private
      # repo, so this needs a token with read access to it.
      - uses: actions/checkout@v4
        with:
          repository: Bambalow28/juwa_wealth
          token: ${{ secrets.JUWA_WEALTH_TOKEN }}
          path: juwa_wealth
      - run: mv juwa_wealth ..

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - run: flutter pub get

      - run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: bundle exec fastlane deploy
